# Premarket v7.2 setup engine config — conservative T0 redesign
#
# Current production principle:
#   - Main decision should come from current premarket auction behavior, amount
#     quality, simple exact tag match to home.kaipan.plate.summary, and hotness.
#   - Do not use T0 plate 主力流入 / 涨停数量; they are noisy or over-complex in
#     premarket usage.
#   - Do not infer theme aliases unless explicitly configured by the user.
#   - T-1 review tables are not used as premarket selection factors by default.
version: "premarket_v7_2"

params:
  premarket_auction_cutoff: "092900"
  qxlive_premarket_boundary: "093000"

  # === v7.2 strict data-available switches ===
  strict_theme_exact_match: true
  use_t1_review_context: false
  ignored_t0_qxlive_metrics:
    - "HSLN"   # 主力流入: premarket often 0/unstable; not used in regime.
    - "PB"     # 今日封板率: early-session value lacks stable meaning.
    - "PBBX"   # qxlive PBBX is 沪深5分钟量能, not 晋级率.
  ignored_t0_plate_fields:
    - "主力流入"
    - "涨停数量"

  # === inherited labels still available but softened ===
  industry_pct_strength_leader: 0.75
  industry_pct_inflow_leader: 0.70
  industry_pct_strength_rising: 0.50
  industry_pct_strength_absorb_dip: 0.25
  industry_subplate_downgrade_steps: 1
  super_ratio_top: 0.4
  super_ratio_mid: 0.3
  super_ratio_main_inflow_floor_wan: 1000
  cashflow_effective_min_wan: 300
  zt_quality_clean_min: 0.7
  zt_quality_average_min: 0.4
  zt_quality_open_punish_max_count: 3
  zt_quality_seal_target_ratio: 0.3
  zt_quality_time_decay_minutes: 240
  theme_history_top_n: 20
  tech_profile_lookback_volume_days: 20
  tech_profile_volume_ratio_min: 0.5
  tech_profile_churn_volume_ratio_min: 2.0
  tech_profile_churn_pct_chg_max: 2.0
  ltgd_top_n_for_longtou: 5
  ltgd_confirmed_board_min: 4
  ltgd_confirmed_board3_rank_max: 3

  # === T0 regime: no HSLN/PB/PBBX ===
  regime_hot_qx_min: 65
  regime_hot_lbbx_min: 5
  regime_cold_qx_max: 30
  regime_cold_dt_min: 20
  regime_cold_kqxy_min: 10
  regime_cold_breadth_max: 0.28
  regime_warming_qx_today_min: 35
  regime_warming_qx_yesterday_max: 30

  # === today_signal weights ===
  weight_auction: 0.65
  weight_theme: 0.25
  weight_hotness: 0.10

  # === auction_strength ===
  auction_top_rank_n: 30
  auction_bonus_fengdan: 3
  min_auction_amount_wan: 500
  full_auction_amount_wan: 1000
  auction_amount_low_multiplier: 0.5
  auction_amount_mid_multiplier: 0.8
  auction_turnover_bonus_high_pct: 1.0
  auction_turnover_bonus_high: 5
  auction_turnover_bonus_mid_pct: 0.5
  auction_turnover_bonus_mid: 3
  auction_amount_bonus_low_wan: 1000
  auction_amount_bonus_low: 1
  auction_amount_bonus_mid_wan: 2000
  auction_amount_bonus_mid: 3
  auction_amount_bonus_high_wan: 5000
  auction_amount_bonus_high: 5
  net_pressure_bonus_low_ratio: 0.0005
  net_pressure_bonus_low: 3
  net_pressure_bonus_mid_ratio: 0.001
  net_pressure_bonus_mid: 5
  net_pressure_bonus_high_ratio: 0.002
  net_pressure_bonus_high: 8

  # qiangchou group semantics:
  #   grab      = 9:20-9:25 sustained抢筹幅度, primary.
  #   qiangchou = 9:24:59 last-second抢筹, confirmation/terminal impulse.
  qiangchou_920_925_bonus: 5
  qiangchou_last_second_multiplier: 0.85
  qiangchou_last_second_confirm_bonus: 6

  # Fengdan behavior.
  fengdan_fake_drop_ratio: 0.30
  fengdan_fake_f15_min_wan: 1000
  fengdan_consume_ratio: 0.80
  fengdan_lock_ratio: 0.90
  fengdan_lock_latest_min_pct: 9.5
  fengdan_fake_penalty_multiplier: 0.70
  fengdan_consume_weak_bonus: 2
  fengdan_lock_bonus: 15

  # Negative-auction cap.
  negative_auction_deep_pct: -6.0
  negative_auction_deep_cap: 20
  negative_auction_mid_pct: -3.0
  negative_auction_mid_cap: 35
  negative_auction_soft_cap: 50

  # Entry/tradability tags.
  entry_board_watch_pct: 9.5
  entry_lock_large_f25_yi: 1.0
  entry_high_open_pct: 8.5

  # Hotness.
  hotness_rocket_top_n: 50
  hotness_hotday_top_n: 100
  hotness_rocket_weight: 0.6
  hotness_hotday_weight: 0.4
  hotness_limitup_cap_pct: 9.7
  hotness_limitup_cap_score: 20

  # Theme strength: only T0 plate strength after exact tag match.
  no_theme_base: 20

  # T-1 multiplier remains small and mostly cashflow/tech-based. Review-derived
  # zt/longtou labels are disabled by use_t1_review_context=false.
  t1_multiplier_min: 0.90
  t1_multiplier_max: 1.10
  iceberg_auction_threshold: 80
  iceberg_bonus: 0.00
  longtou_confirmed_bonus: 0.00
  longtou_board_leader_bonus: 0.00
  cashflow_strong_bonus: 0.03
  cashflow_distributing_penalty: -0.05
  cashflow_distributing_outflow_threshold_wan: -300
  zt_clean_bonus: 0.00
  zt_dirty_penalty: 0.00
  tech_breakdown_penalty: -0.04
  churn_dull_penalty: -0.06
  churn_dull_iceberg_penalty: -0.03
  churn_panic_penalty: -0.05
  churn_panic_pct_chg_max: -3.0
  churn_panic_vol_ratio_min: 3.0

  # Setup classification.
  setup_lead_auction_min: 70
  setup_new_auction_min: 70
  setup_new_high_confidence_auction: 85
  setup_new_high_confidence_hotness: 50
  setup_rotate_theme_min: 65
  setup_rotate_auction_min: 50

  # Risk penalty.
  risk_st_kill: true
  risk_high_board_threshold: 6
  risk_mid_board_min: 4
  risk_mid_board_max: 5
  risk_main_outflow_heavy_wan: -20000
  risk_outflow_float_mv_ratio: -0.005
  risk_high_board_penalty: 0.75
  risk_mid_board_penalty: 0.85
  risk_low_board_penalty: 0.92
  risk_only_one_factor_penalty: 0.95

regime_multiplier:
  cold:
    T0-LEAD: 0.95
    T0-NEW: 0.85
    T0-ROTATE: 0.80
    T0-GENERAL: 0.85
  cold_to_warming:
    T0-LEAD: 1.05
    T0-NEW: 1.05
    T0-ROTATE: 1.00
    T0-GENERAL: 0.95
  normal:
    T0-LEAD: 1.00
    T0-NEW: 1.00
    T0-ROTATE: 1.00
    T0-GENERAL: 1.00
  hot:
    T0-LEAD: 1.05
    T0-NEW: 1.00
    T0-ROTATE: 1.05
    T0-GENERAL: 0.95
  hot_to_downgrading:
    T0-LEAD: 1.00
    T0-NEW: 0.85
    T0-ROTATE: 0.90
    T0-GENERAL: 0.85

intraday_anchors:
  T0-LEAD:
    - "9:31 前是否出现瞬时封板/回封动作"
    - "封单是否 ≥ 1 亿"
    - "10:00 前不破开盘 -1.0%"
  T0-NEW-high:
    - "9:35 前涨幅 ≥ 2%"
    - "9:30-9:35 分时不破开盘价"
    - "10:00 前成交额 ≥ 3 亿"
  T0-NEW-low:
    - "9:35 前涨幅 ≥ 1.5%"
    - "9:30-9:35 不破开盘 -0.5%"
    - "10:00 前成交额 ≥ 2 亿"
  T0-ROTATE:
    - "10:00 前成交额 ≥ 5 亿"
    - "10:00 不破开盘 -1.0%"
    - "板块龙头/龙二是否同步红盘"
  T0-GENERAL:
    - "不破开盘 -2%"
    - "9:45 前不放巨量阴线"
    - "盘中观察,不作为主候选"

theme_aliases: []

output:
  max_candidates: 30
  watch_tier_max: 50

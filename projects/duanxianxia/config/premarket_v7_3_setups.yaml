# Premarket v7.3 portfolio edge engine
# A full rebuild: discovery -> edge evaluation -> portfolio construction.
# Target: few decisions, explicit no-trade, no debug/no-setup BUY, capped WATCH_TOP.
version: "premarket_v7_3_portfolio_edge_engine_v1"

output:
  max_candidates: 5
  watch_tier_max: 18
  pool_max: 12

action_pools:
  broad_theme_names:
    - "一季报增长"
    - "业绩增长"
    - "年报增长"
    - "半年报增长"
    - "业绩预增"
    - "并购重组"
    - "股权转让"
    - "实控人变更"

  # Base v7.3 classifiers stay broad; final BUY is decided only by the edge engine.
  high_cost_pct: 8.5
  board_watch_pct: 9.5

  follow_pct_min: 2.0
  follow_pct_max: 7.5
  follow_min_auction_strength: 50
  follow_min_source_evidence: 18
  follow_min_source_family_count: 2

  momentum_pct_min: 2.0
  momentum_pct_max: 5.8
  momentum_min_auction_strength: 50
  momentum_min_liquidity_score: 55
  momentum_min_amount_wan: 1000

  theme_catchup_min_theme: 80
  theme_catchup_pct_min: -1.5
  theme_catchup_pct_max: 3.5
  theme_catchup_strong_min_aux_score: 35
  theme_catchup_weak_max_aux_score: 12
  theme_weak_score_penalty: 6

  reversal_min_auction_strength: 25
  net_pressure_full_ratio: 0.002

  confirmation_high_cost_pct: 7.0
  confirmation_high_cost_score_penalty: 12

  fake_watch_pct_min: -5.0
  fake_watch_pct_max: 5.8
  fake_watch_min_liquidity_score: 45
  fake_watch_min_amount_wan: 800

  soft_avoid_pct_min: -3.5
  soft_avoid_pct_max: 4.0
  soft_avoid_min_liquidity_score: 0
  soft_avoid_min_amount_wan: 0

  # Edge score construction.
  rank_prior_full: 38
  rank_prior_decay: 0.45
  amount_full_wan: 5000
  soft_cost_penalty_start_pct: 5.8
  min_any_buy_amount_wan: 1000
  min_any_buy_liquidity: 35
  absolute_cost_kill_pct: 7.2

  # Regime-aware portfolio bars.  Cold days must be allowed to say no.
  edge_buy_threshold_normal: 64
  edge_buy_threshold_warming: 66
  edge_buy_threshold_cold: 72
  max_buy_normal: 5
  max_buy_warming: 4
  max_buy_cold: 2

  # Family caps: avoid one pattern dominating the book.
  cap_attack: 2
  cap_momentum: 2
  cap_reversal: 2
  cap_theme: 1
  cap_deep_reversal: 1

  # Deep low-open reversal is high-odds/high-risk and needs exceptional support.
  deep_reversal_min_amount_wan: 9000
  deep_reversal_min_auction: 35

  # WATCH_TOP is a near-miss list, not a 79-name dumping ground.
  watch_top_max: 12
  watch_edge_gap: 14

  # Broad repair is recall/watch only in v1.  Do not buy DEBUG_ONLY/no-setup rows.
  broad_repair_buy_enabled: false

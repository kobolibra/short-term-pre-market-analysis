# v7.3 simple premarket signal selector
# No decorative concept stack.  Only a small BUY list from real premarket signals.
version: "premarket_v7_3_simple_signal_selector_v1"

output:
  max_candidates: 5
  watch_tier_max: 15
  pool_max: 10

action_pools:
  # Existing base classifiers still create the raw action candidates.  The final
  # selector below is the trading decision layer.
  broad_theme_names:
    - "一季报增长"
    - "业绩增长"
    - "年报增长"
    - "半年报增长"
    - "业绩预增"
    - "并购重组"
    - "股权转让"
    - "实控人变更"

  high_cost_pct: 8.5
  board_watch_pct: 9.5

  follow_pct_min: 2.0
  follow_pct_max: 7.5
  follow_min_auction_strength: 50
  follow_min_source_evidence: 18
  follow_min_source_family_count: 2

  momentum_pct_min: 2.0
  momentum_pct_max: 5.8
  momentum_min_auction_strength: 50
  momentum_min_liquidity_score: 55
  momentum_min_amount_wan: 1000

  theme_catchup_min_theme: 80
  theme_catchup_pct_min: -1.5
  theme_catchup_pct_max: 3.5
  theme_catchup_strong_min_aux_score: 35
  theme_catchup_weak_max_aux_score: 12
  theme_weak_score_penalty: 6

  reversal_min_auction_strength: 25
  net_pressure_full_ratio: 0.002

  confirmation_high_cost_pct: 7.0
  confirmation_high_cost_score_penalty: 12

  fake_watch_pct_min: -5.0
  fake_watch_pct_max: 5.8
  fake_watch_min_liquidity_score: 45
  fake_watch_min_amount_wan: 800

  soft_avoid_pct_min: -3.5
  soft_avoid_pct_max: 4.0
  soft_avoid_min_liquidity_score: 0
  soft_avoid_min_amount_wan: 0

  # Final simple signal selector.
  rank_prior_points: 32
  rank_prior_decay: 0.35
  amount_full_wan: 5000
  min_amount_wan: 1200
  min_liquidity: 35
  soft_cost_start_pct: 5.8
  absolute_max_cost_pct: 7.0

  buy_score_normal: 64
  buy_score_warming: 66
  buy_score_cold: 72
  max_buy_normal: 5
  max_buy_warming: 4
  max_buy_cold: 2

  cap_auction_follow: 2
  cap_momentum: 2
  cap_reversal: 2
  cap_theme: 1
  cap_deep_reversal: 1

  deep_reversal_min_amount_wan: 9000
  deep_reversal_min_auction: 35

  watch_max: 10
  watch_score_gap: 12

# v7.4 next-level high-conviction premarket selector
# Goal: fewer, cleaner BUY signals with better expected win-rate/odds.
# Production inputs must be visible at/around 09:25.  Close/excess return is review-only.
version: "premarket_v7_4_next_level_high_conviction"

output:
  max_candidates: 3
  watch_tier_max: 12
  pool_max: 10

action_pools:
  broad_theme_names:
    - "一季报增长"
    - "业绩增长"
    - "年报增长"
    - "半年报增长"
    - "业绩预增"
    - "并购重组"
    - "股权转让"
    - "实控人变更"

  # Base v7.3 classification knobs retained for compatibility.
  high_cost_pct: 8.5
  board_watch_pct: 9.5
  follow_pct_min: 2.0
  follow_pct_max: 7.5
  follow_min_auction_strength: 50
  follow_min_source_evidence: 18
  follow_min_source_family_count: 2
  momentum_pct_min: 2.0
  momentum_pct_max: 5.8
  momentum_min_auction_strength: 50
  momentum_min_liquidity_score: 55
  momentum_min_amount_wan: 1000
  theme_catchup_min_theme: 80
  theme_catchup_pct_min: -1.5
  theme_catchup_pct_max: 3.5
  theme_catchup_strong_min_aux_score: 35
  theme_catchup_weak_max_aux_score: 12
  theme_weak_score_penalty: 6
  reversal_min_auction_strength: 25
  net_pressure_full_ratio: 0.002
  confirmation_high_cost_pct: 7.0
  confirmation_high_cost_score_penalty: 12
  fake_watch_pct_min: -5.0
  fake_watch_pct_max: 5.8
  fake_watch_min_liquidity_score: 45
  fake_watch_min_amount_wan: 800
  soft_avoid_pct_min: -3.5
  soft_avoid_pct_max: 4.0
  soft_avoid_min_liquidity_score: 0
  soft_avoid_min_amount_wan: 0

  # v7.4 durable selector.
  absolute_max_cost_pct: 6.8
  hard_min_amount_wan: 500
  hard_min_liquidity: 25
  rank_prior_points: 18
  rank_prior_decay: 0.30
  amount_full_wan: 7000

  buy_score_normal: 72
  buy_score_warming: 74
  buy_score_cold: 78
  max_buy_normal: 3
  max_buy_warming: 2
  max_buy_cold: 1
  cap_reversal: 2
  cap_momentum: 1
  cap_follow: 1

  # Discounted reversal: needs negative auction cost + real primary order support.
  reversal_pct_min: -7.5
  reversal_pct_max: -1.0
  reversal_min_amount_wan: 3500
  reversal_min_auction: 24
  reversal_primary_rank_max: 60
  deep_reversal_pct: -6.0
  deep_reversal_min_amount_wan: 9000
  deep_reversal_min_auction: 38
  deep_reversal_best_rank_max: 20

  # Confirmed momentum: cheaper, stronger, and more independently confirmed.
  momentum_min_pct: 1.2
  momentum_max_pct: 4.8
  momentum_min_amount_wan: 3000
  momentum_min_auction: 55
  momentum_min_liquidity: 50
  momentum_rank_max: 45
  momentum_primary_rank_max: 45
  volatile_momentum_min_source_count: 2
  volatile_momentum_best_rank_max: 10
  volatile_momentum_min_amount_wan: 15000
  volatile_board_penalty: 8
  crowded_theme_cost_max_cold: 3.2
  crowded_theme_min_source_count: 3
  crowded_theme_penalty: 8

  # Follow-through: requires multi-source confirmation and no cold volatile-board chase.
  follow_min_pct: 2.0
  follow_max_pct: 5.2
  follow_min_amount_wan: 5000
  follow_min_auction: 60
  follow_min_source_count: 2
  follow_best_rank_max: 20

  # Theme catch-up is watch-only in v7.4.
  theme_watch_min_theme: 80
  theme_watch_max_pct: 2.2

  watch_max: 10
  watch_score_gap: 16

# Premarket v7.3 practical portfolio selection
# Recalibrated after the 2026-05-19/20/21 reruns: the previous strict gate
# over-selected synthetic broad-repair/debug names.  This version uses the
# original expected-return rank as a prior, then requires executable evidence.
version: "premarket_v7_3_rank_prior_evidence_portfolio"

output:
  max_candidates: 5
  watch_tier_max: 30
  pool_max: 10

action_pools:
  broad_theme_names:
    - "一季报增长"
    - "业绩增长"
    - "年报增长"
    - "半年报增长"
    - "业绩预增"
    - "并购重组"
    - "股权转让"
    - "实控人变更"

  high_cost_pct: 8.5
  board_watch_pct: 9.5

  follow_pct_min: 2.0
  follow_pct_max: 7.5
  follow_min_auction_strength: 50
  follow_min_source_evidence: 18
  follow_min_source_family_count: 2

  momentum_pct_min: 2.0
  momentum_pct_max: 5.8
  momentum_min_auction_strength: 50
  momentum_min_liquidity_score: 55
  momentum_min_amount_wan: 1000

  theme_catchup_min_theme: 80
  theme_catchup_pct_min: -1.5
  theme_catchup_pct_max: 3.5
  theme_catchup_strong_min_aux_score: 35
  theme_catchup_weak_max_aux_score: 12
  theme_weak_score_penalty: 6

  reversal_min_auction_strength: 25
  net_pressure_full_ratio: 0.002

  confirmation_high_cost_pct: 7.0
  confirmation_high_cost_score_penalty: 12

  fake_watch_pct_min: -5.0
  fake_watch_pct_max: 5.8
  fake_watch_min_liquidity_score: 45
  fake_watch_min_amount_wan: 800

  soft_avoid_pct_min: -3.5
  soft_avoid_pct_max: 4.0
  soft_avoid_min_liquidity_score: 0
  soft_avoid_min_amount_wan: 0

  # Final portfolio selection.  Normal/cold thresholds are deliberately lower
  # than the previous over-strict conviction gate, but rows must pass explicit
  # action-specific evidence gates and type caps.
  portfolio_buy_min_score: 58
  portfolio_buy_min_score_cold: 62
  buy_hard_max_pct: 7.2
  buy_soft_max_pct: 6.4
  amount_full_wan: 5000

  max_auction_follow: 2
  max_momentum: 2
  max_low_open: 2
  max_theme: 1
  max_broad_repair_buy: 0

  # Broad repair: keep recall/watch, but do not buy by default.  The prior
  # overlay's main failure was turning too many DEBUG_ONLY/no-setup rows into BUY.
  broad_repair_buy_enabled: false
  broad_repair_theme_max: 20
  broad_repair_source_max: 1.0
  broad_repair_family_max: 1
  broad_repair_min_auction_strength: 18
  broad_repair_min_amount_wan: 1500

# Unified v8 production edge engine.
# Filename is kept for deployment compatibility with existing runner paths.
version: "premarket_v8_unified_edge_engine"

output:
  max_candidates: 4
  watch_tier_max: 12
  pool_max: 8

engine:
  broad_theme_names:
    - "一季报增长"
    - "业绩增长"
    - "年报增长"
    - "半年报增长"
    - "业绩预增"
    - "并购重组"
    - "股权转让"
    - "实控人变更"

  # Global hard gates. Price/cost uses auction_change_pct only.
  absolute_max_cost_pct: 7.0
  hard_min_amount_wan: 300
  hard_min_liquidity: 20
  amount_quality_full_wan: 9000
  rank_prior_decay_points: 2.5

  # Market regime budget.
  buy_score_hot: 70
  buy_score_normal: 70
  buy_score_warming: 73
  buy_score_cold: 78
  max_buy_hot: 4
  max_buy_normal: 4
  max_buy_warming: 3
  max_buy_cold: 1

  # Pattern caps keep BUY concentrated and avoid one-style crowding.
  cap_reversal: 2
  cap_momentum: 1
  cap_follow: 1
  cap_theme_confirmed: 1

  # LOW_OPEN_NET_REVERSAL: discounted cost + real order support.
  reversal_pct_min: -8.2
  reversal_pct_max: -0.5
  reversal_min_amount_wan: 3200
  reversal_min_auction: 22
  reversal_primary_rank_max: 60
  reversal_min_source_evidence: 8
  deep_reversal_pct: -6.5
  deep_reversal_min_amount_wan: 8000
  deep_reversal_min_confirmation: 48

  # CONFIRMED_MOMENTUM: moderate auction cost + independent confirmation.
  momentum_min_pct: 1.2
  momentum_max_pct: 5.2
  momentum_min_amount_wan: 2500
  momentum_min_auction: 50
  momentum_min_liquidity: 45
  momentum_rank_max: 60
  cold_momentum_min_confirmation: 52

  # AUCTION_FOLLOW_THROUGH: healthy cost + multi-source auction evidence.
  follow_min_pct: 1.8
  follow_max_pct: 5.8
  follow_min_amount_wan: 3000
  follow_min_auction: 55
  follow_min_source_count: 2
  follow_best_rank_max: 20

  # THEME_AUCTION_CONFIRMED: theme can BUY only after auction confirmation.
  theme_buy_min_theme: 82
  theme_buy_min_pct: -0.8
  theme_buy_max_pct: 3.5
  theme_buy_min_amount_wan: 2800
  theme_buy_min_confirmation: 50

  # Watch band.
  watch_max: 8
  watch_score_gap: 14

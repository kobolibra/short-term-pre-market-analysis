# Premarket v7.3 action-pool production overlay
# Practical reset: adaptive, excess-return first, not sector-hardcoded.
version: "premarket_v7_3_adaptive_excess_return"

output:
  max_candidates: 30
  watch_tier_max: 80
  pool_max: 20

action_pools:
  # Event/broad labels are not killed, but need stronger independent evidence.
  broad_theme_names:
    - "一季报增长"
    - "业绩增长"
    - "年报增长"
    - "半年报增长"
    - "业绩预增"
    - "并购重组"
    - "股权转让"
    - "实控人变更"

  broad_event_themes:
    - "并购重组"
    - "股权转让"
    - "实控人变更"
    - "一季报增长"
    - "业绩增长"
    - "业绩预增"
    - "摘帽"

  retreat_keywords:
    - "昨日连板"
    - "连板"
    - "高标"
    - "断板"
    - "退潮"

  # Dynamic current-day theme leadership. No fixed sector whitelist.
  dynamic_theme_min_strength: 70
  dynamic_theme_min_family_count: 1
  dynamic_theme_min_source: 12
  broad_event_min_source: 20

  # Cost/liquidity gates for excess-return candidates.
  low_cost_pct_min: -3.5
  low_cost_pct_max: 4.5
  primary_min_amount_wan: 600
  primary_min_auction_strength: 10
  retreat_high_cost_pct: 6.5
  expected_cost_penalty_start_pct: 4.8
  expected_cost_penalty_per_pct: 3.0

  high_cost_pct: 8.5
  board_watch_pct: 9.5

  follow_pct_min: 2.0
  follow_pct_max: 7.2
  follow_min_auction_strength: 50
  follow_min_source_evidence: 18
  follow_min_source_family_count: 2

  momentum_pct_min: 1.5
  momentum_pct_max: 5.2
  momentum_min_auction_strength: 50
  momentum_min_liquidity_score: 55
  momentum_min_amount_wan: 1000

  # Theme catch-up must be current-day confirmed and low-cost; otherwise watch-only.
  theme_catchup_min_theme: 80
  theme_catchup_pct_min: -1.5
  theme_catchup_pct_max: 3.2
  theme_catchup_strong_min_aux_score: 42
  theme_catchup_weak_max_aux_score: 18
  theme_weak_score_penalty: 10
  theme_action_min_amount_wan: 1200
  theme_confirmation_score_penalty: 12

  reversal_min_auction_strength: 25
  deep_low_open_watch_pct: -5.0
  net_pressure_full_ratio: 0.002

  confirmation_high_cost_pct: 6.5
  confirmation_high_cost_score_penalty: 16

  fake_watch_pct_min: -5.0
  fake_watch_pct_max: 5.0
  fake_watch_min_liquidity_score: 45
  fake_watch_min_amount_wan: 800

  soft_avoid_pct_min: -3.5
  soft_avoid_pct_max: 4.0
  soft_avoid_min_liquidity_score: 0
  soft_avoid_min_amount_wan: 0

  dynamic_repair_score_min: 36
  low_cost_elastic_score_min: 34
  low_amount_vratio_max_amount_wan: 2500
  generic_repair_score_min: 38

# Premarket v7.3 action-pool production overlay
#
# v7.3 is the formal production entry for the action-pool redesign. It keeps the
# v7.2 data/scoring foundation, then upgrades the output contract so users read
# candidates by trading action instead of one mixed final_score rank.
version: "premarket_v7_3"

output:
  max_candidates: 30
  watch_tier_max: 60
  pool_max: 15

action_pools:
  broad_theme_names:
    - "一季报增长"
    - "业绩增长"
    - "年报增长"
    - "半年报增长"
    - "业绩预增"
    - "并购重组"
    - "股权转让"
  high_cost_pct: 8.5
  board_watch_pct: 9.5

  follow_pct_min: 2.0
  follow_pct_max: 7.5
  follow_min_auction_strength: 50
  follow_min_source_evidence: 18
  follow_min_source_family_count: 2

  momentum_pct_min: 2.0
  momentum_pct_max: 5.8
  momentum_min_auction_strength: 50
  momentum_min_liquidity_score: 55
  momentum_min_amount_wan: 1000

  theme_catchup_min_theme: 80
  theme_catchup_pct_min: -1.5
  theme_catchup_pct_max: 3.5
  theme_catchup_strong_min_aux_score: 35
  theme_catchup_weak_max_aux_score: 12
  theme_weak_score_penalty: 6

  reversal_min_auction_strength: 25
  net_pressure_full_ratio: 0.002

  # High auction cost is a risk by itself.  v7.3 always tags confirmation rows
  # above this cost as high_cost_watch, even if some source evidence exists.
  confirmation_high_cost_pct: 7.0
  confirmation_high_cost_score_penalty: 12

  # FAKE_STRENGTH split:
  # - FAKE_STRENGTH_WATCH: not actionable premarket, but suitable for intraday repair checks.
  # - SOFT_AVOID_REPAIR_CANDIDATE: still non-actionable; captures avoid rows that are not hard avoid.
  fake_watch_pct_min: -5.0
  fake_watch_pct_max: 5.8
  fake_watch_min_liquidity_score: 45
  fake_watch_min_amount_wan: 800

  # Wider than fake-watch by design: soft avoid is review/intraday-confirmation only,
  # not an actionable premarket pool.  It prevents moderate-cost avoid rows from
  # being mislabeled as hard avoid before multi-day evidence is available.
  soft_avoid_pct_min: -3.5
  soft_avoid_pct_max: 4.0
  soft_avoid_min_liquidity_score: 0
  soft_avoid_min_amount_wan: 0

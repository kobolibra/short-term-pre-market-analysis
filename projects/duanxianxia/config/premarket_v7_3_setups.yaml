# Premarket v7.3 action-pool production overlay
# Balanced rollback after 183925 effect check:
# - restore broad repair momentum recall that worked better than elastic-first
# - keep high-cost / board / fake-strength as watch-only
# - do not hard-code any sector as the answer
# - do not allow 20cm/low-cost alone to dominate ranking
version: "premarket_v7_3_balanced_rollback"

output:
  max_candidates: 30
  watch_tier_max: 60
  pool_max: 15

action_pools:
  broad_theme_names:
    - "一季报增长"
    - "业绩增长"
    - "年报增长"
    - "半年报增长"
    - "业绩预增"
    - "并购重组"
    - "股权转让"
    - "实控人变更"
  high_cost_pct: 8.5
  board_watch_pct: 9.5

  follow_pct_min: 2.0
  follow_pct_max: 7.5
  follow_min_auction_strength: 50
  follow_min_source_evidence: 18
  follow_min_source_family_count: 2

  momentum_pct_min: 2.0
  momentum_pct_max: 5.8
  momentum_min_auction_strength: 50
  momentum_min_liquidity_score: 55
  momentum_min_amount_wan: 1000

  theme_catchup_min_theme: 80
  theme_catchup_pct_min: -1.5
  theme_catchup_pct_max: 3.5
  theme_catchup_strong_min_aux_score: 35
  theme_catchup_weak_max_aux_score: 12
  theme_weak_score_penalty: 6

  reversal_min_auction_strength: 25
  net_pressure_full_ratio: 0.002

  confirmation_high_cost_pct: 7.0
  confirmation_high_cost_score_penalty: 12

  fake_watch_pct_min: -5.0
  fake_watch_pct_max: 5.8
  fake_watch_min_liquidity_score: 45
  fake_watch_min_amount_wan: 800

  soft_avoid_pct_min: -3.5
  soft_avoid_pct_max: 4.0
  soft_avoid_min_liquidity_score: 0
  soft_avoid_min_amount_wan: 0

  broad_repair_enabled: true
  broad_repair_theme_max: 20
  broad_repair_source_max: 1.0
  broad_repair_family_max: 1
  broad_repair_pct_min: -2.0
  broad_repair_pct_max: 5.0
  broad_repair_min_auction_strength: 12
  broad_repair_min_amount_wan: 800
  broad_repair_deep_pct_min: -18.0
  broad_repair_deep_pct_max: -5.0
  broad_repair_deep_min_auction_strength: 8
  broad_repair_deep_min_amount_wan: 800
  broad_repair_score_min: 24

  high_cost_repair_watch_pct_min: 7.0
  high_cost_repair_watch_pct_max: 10.5
  high_cost_repair_watch_min_amount_wan: 5000
  high_cost_repair_watch_min_theme: 80

  # Expected-return proxy weights. Display/order only; classification remains rule-based.
  expected_bonus_momentum: 30
  expected_bonus_low_open_reversal: 27
  expected_bonus_broad_repair: 24
  expected_bonus_theme: 16
  expected_bonus_auction_follow: 13
  expected_bonus_fake_watch: 4
  expected_bonus_high_cost_repair_watch: -8
